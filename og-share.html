<!doctype html>
<!-- Source of assets/og-statly.jpg (the 1200x630 link preview). Re-render with headless Chrome:
     Chrome --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=assets/og-statly.jpg og-share.html -->
<html lang="en"><head><meta charset="utf-8"><title>Statly share image</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif; color: #0B2A1F; position: relative;
    background:
      radial-gradient(520px 420px at 0% 0%, rgba(143,224,187,1), transparent 70%),
      radial-gradient(520px 460px at 100% 30%, rgba(255,194,154,.9), transparent 70%),
      radial-gradient(520px 420px at 6% 100%, rgba(142,197,240,.9), transparent 70%),
      radial-gradient(520px 420px at 80% 105%, rgba(201,182,255,.9), transparent 70%), #D8EADF; }
  .copy { position: absolute; left: 80px; top: 92px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
  .brand img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 10px 24px -8px rgba(16,64,44,.4); }
  h1 { font-size: 74px; line-height: 1.02; letter-spacing: -.035em; margin: 40px 0 24px; font-weight: 800; }
  h1 span { color: #0F6B4F; }
  p { font-size: 25px; line-height: 1.4; color: #33524A; margin: 0; }
  .chips { display: flex; gap: 12px; margin-top: 30px; }
  .chips b { font-size: 20px; padding: 9px 18px; border-radius: 999px; background: rgba(255,255,255,.65); border: 1px solid rgba(255,255,255,.85); }
  .phone { position: absolute; right: 150px; top: 54px; width: 300px; padding: 10px; background: #121816; border-radius: 44px;
    box-shadow: 0 40px 70px -30px rgba(10,40,28,.6); transform: rotate(4deg); }
  .phone img { width: 100%; display: block; border-radius: 34px; }
  .widget { position: absolute; right: 40px; top: 420px; width: 270px; transform: rotate(-5deg);
    filter: drop-shadow(0 20px 26px rgba(16,64,44,.35)); }
</style></head>
<body>
  <div class="copy">
    <div class="brand"><img src="assets/icon-192.png" alt="">Statly</div>
    <h1>Your steps,<br><span>calm and clear.</span></h1>
    <p>Counts your steps and estimates your sleep with your phone. Streaks, badges and widgets.</p>
    <div class="chips"><b>No watch needed</b><b>No other app</b><b>No account</b></div>
  </div>
  <div class="phone"><img src="assets/s-today.webp" alt=""></div>
  <img class="widget" src="assets/w-real.webp" alt="">
</body></html>
